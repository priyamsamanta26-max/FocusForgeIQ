<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusForgeIQ - Ultra Advanced</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --bg:#f1f5f9;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --primary:#2563eb;
  --success:#16a34a;
  --danger:#dc2626;
}
.dark{
  --bg:#0f172a;
  --card:#111827;
  --text:#f8fafc;
  --muted:#94a3b8;
  --border:#374151;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem;
  background:#0f172a;
  color:#fff;
  position:sticky;
  top:0;
  z-index:10;
}
header h1{margin:0}
header p{margin:0;color:#cbd5e1;font-size:.9rem}
.container{
  max-width:1200px;
  margin:auto;
  padding:1rem;
  display:grid;
  gap:1rem;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:1rem;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}
.grid{display:grid;gap:1rem}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{
  border:1px solid var(--border);
  border-radius:16px;
  padding:1rem;
  text-align:center;
}
.stat span{
  display:block;
  font-size:2rem;
  font-weight:700;
}
.row{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
  align-items:center;
}
input,textarea,select{
  width:100%;
  padding:.8rem;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
}
button{
  border:none;
  border-radius:12px;
  padding:.8rem 1rem;
  background:var(--primary);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}
button.secondary{background:#334155}
button.danger{background:var(--danger)}
#timer{
  font-size:4rem;
  font-weight:800;
  text-align:center;
  margin:1rem 0;
}
#timerMode{
  text-align:center;
  font-weight:700;
  color:var(--primary);
}
.item{
  border:1px solid var(--border);
  border-radius:12px;
  padding:.8rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:.5rem;
  margin-top:.5rem;
}
small{color:var(--muted)}
#toast{
  position:fixed;
  right:1rem;
  bottom:1rem;
  background:#111827;
  color:#fff;
  padding:.9rem 1rem;
  border-radius:12px;
  display:none;
  z-index:100;
}
canvas{
  max-width:100%;
}
@media(max-width:600px){
  #timer{font-size:3rem}
  header{flex-direction:column;align-items:flex-start;gap:.5rem}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🔥 FocusForgeIQ</h1>
    <p>Forge your focus. Power your intelligence.</p>
  </div>
  <button id="themeBtn" class="secondary">🌙 Theme</button>
</header>

<div class="container">

  <section class="card">
    <h2>Welcome to FocusForgeIQ</h2>
    <p id="todayDate"></p>
  </section>

  <section class="grid grid-4">
    <div class="stat"><span id="streakStat">0</span>Streak</div>
    <div class="stat"><span id="sessionStat">0</span>Pomodoros</div>
    <div class="stat"><span id="taskStat">0</span>Tasks</div>
    <div class="stat"><span id="examStat">0</span>Exams</div>
  </section>

  <section class="card">
    <h2>⏳ Ultra Pomodoro (Custom Time)</h2>

    <div id="timer">25:00</div>
    <p id="timerMode">Mode: Study</p>

    <div class="grid grid-2">
      <div>
        <label>Study Minutes</label>
        <input id="studyInput" type="number" min="1" max="300" value="25">
      </div>

      <div>
        <label>Break Minutes</label>
        <input id="breakInput" type="number" min="1" max="120" value="5">
      </div>
    </div>

    <div class="row" style="margin-top:1rem">
      <button onclick="applyCustomTime()">Apply Time</button>
      <button onclick="startTimer()">Start</button>
      <button onclick="pauseTimer()">Pause</button>
      <button onclick="resetTimer()">Reset</button>
    </div>
  </section>

  <section class="card">
    <h2>📝 Smart Notes</h2>
    <textarea id="notes" rows="6" placeholder="Write your notes here..."></textarea>
    <div class="row" style="margin-top:.5rem">
      <button onclick="saveNotes()">Save Notes</button>
      <button onclick="exportNotes()">Export Notes</button>
    </div>
  </section>

  <section class="card">
    <h2>🔥 Study Streak</h2>
    <p id="streakDisplay" style="font-size:2rem;font-weight:700">0 Days</p>
    <button onclick="markStudy()">I Studied Today</button>
  </section>

  <section class="card">
    <h2>✅ Tasks</h2>
    <div class="row">
      <input id="taskInput" placeholder="Task title">
      <button onclick="addTask()">Add Task</button>
    </div>
    <div id="taskList"></div>
  </section>

  <section class="card">
    <h2>📅 Exam Countdown</h2>
    <div class="grid grid-2">
      <input id="examName" placeholder="Exam name">
      <input id="examDate" type="date">
    </div>
    <div style="height:.5rem"></div>
    <button onclick="addExam()">Add Exam</button>
    <div id="examList"></div>
  </section>

  <section class="card">
    <h2>🎓 SGPA Calculator</h2>
    <div class="grid grid-2">
      <input id="subName" placeholder="Subject">
      <input id="credits" type="number" placeholder="Credits">
      <select id="grade">
        <option value="10">O (10)</option>
        <option value="9">A+ (9)</option>
        <option value="8">A (8)</option>
        <option value="7">B+ (7)</option>
        <option value="6">B (6)</option>
      </select>
      <button onclick="addSubject()">Add Subject</button>
    </div>
    <div id="sgpaList"></div>
    <h3 id="sgpaResult">SGPA: 0.00</h3>
  </section>

  <section class="card">
    <h2>📊 Weekly Analytics</h2>
    <canvas id="analyticsChart" height="120"></canvas>
  </section>

</div>

<div id="toast"></div>

<script>
// ===== Helpers =====
const $ = id => document.getElementById(id);

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2500);
}

// ===== Date =====
function updateDate(){
  $('todayDate').textContent = new Date().toLocaleDateString('en-IN',{
    weekday:'long',
    day:'numeric',
    month:'long',
    year:'numeric'
  });
}
updateDate();
setInterval(updateDate, 60000);

// ===== Theme =====
if(localStorage.getItem('ffi_theme') === 'dark'){
  document.documentElement.classList.add('dark');
}
$('themeBtn').onclick = () => {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('ffi_theme',
    document.documentElement.classList.contains('dark') ? 'dark' : 'light');
};

// ===== Custom Pomodoro =====
let studyMinutes = parseInt(localStorage.getItem('ffi_study') || '25');
let breakMinutes = parseInt(localStorage.getItem('ffi_break') || '5');

$('studyInput').value = studyMinutes;
$('breakInput').value = breakMinutes;

let currentMinutes = studyMinutes;
let timeLeft = currentMinutes * 60;
let timerId = null;
let isBreak = false;

function renderTimer(){
  const m = String(Math.floor(timeLeft / 60)).padStart(2,'0');
  const s = String(timeLeft % 60).padStart(2,'0');
  $('timer').textContent = `${m}:${s}`;
}

function applyCustomTime(){
  const study = parseInt($('studyInput').value);
  const brk = parseInt($('breakInput').value);

  if(isNaN(study) || study < 1 || study > 300){
    toast('Study time must be 1-300 minutes');
    return;
  }
  if(isNaN(brk) || brk < 1 || brk > 120){
    toast('Break time must be 1-120 minutes');
    return;
  }

  studyMinutes = study;
  breakMinutes = brk;

  localStorage.setItem('ffi_study', studyMinutes);
  localStorage.setItem('ffi_break', breakMinutes);

  pauseTimer();
  isBreak = false;
  currentMinutes = studyMinutes;
  timeLeft = currentMinutes * 60;
  $('timerMode').textContent = 'Mode: Study';
  renderTimer();

  toast(`Timer set: ${studyMinutes}m study / ${breakMinutes}m break`);
}

function startTimer(){
  if(timerId) return;

  timerId = setInterval(() => {
    timeLeft--;
    renderTimer();

    if(timeLeft <= 0){
      clearInterval(timerId);
      timerId = null;

      if(!isBreak){
        let sessions = parseInt(localStorage.getItem('ffi_sessions') || '0') + 1;
        localStorage.setItem('ffi_sessions', sessions);
        $('sessionStat').textContent = sessions;

        toast('Study session completed! Break started.');

        isBreak = true;
        currentMinutes = breakMinutes;
        timeLeft = currentMinutes * 60;
        $('timerMode').textContent = 'Mode: Break';
      }else{
        toast('Break completed! Study session ready.');

        isBreak = false;
        currentMinutes = studyMinutes;
        timeLeft = currentMinutes * 60;
        $('timerMode').textContent = 'Mode: Study';
      }

      renderTimer();
    }
  }, 1000);
}

function pauseTimer(){
  clearInterval(timerId);
  timerId = null;
}

function resetTimer(){
  pauseTimer();
  currentMinutes = isBreak ? breakMinutes : studyMinutes;
  timeLeft = currentMinutes * 60;
  renderTimer();
}

renderTimer();
$('sessionStat').textContent = localStorage.getItem('ffi_sessions') || '0';

// ===== Notes =====
$('notes').value = localStorage.getItem('ffi_notes') || '';

function saveNotes(){
  localStorage.setItem('ffi_notes', $('notes').value);
  toast('Notes saved');
}

function exportNotes(){
  const blob = new Blob([$('notes').value], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'FocusForgeIQ_Notes.txt';
  a.click();
}

$('notes').addEventListener('input', () => {
  clearTimeout(window.noteTimer);
  window.noteTimer = setTimeout(() => {
    localStorage.setItem('ffi_notes', $('notes').value);
  }, 2000);
});

// ===== Streak =====
function today(){ return new Date().toISOString().split('T')[0]; }

let streak = JSON.parse(localStorage.getItem('ffi_streak') ||
  '{"count":0,"last":""}');

function renderStreak(){
  $('streakDisplay').textContent =
    `${streak.count} Day${streak.count === 1 ? '' : 's'}`;
  $('streakStat').textContent = streak.count;
}

function markStudy(){
  if(streak.last === today()){
    toast('Already marked today');
    return;
  }

  const y = new Date();
  y.setDate(y.getDate() - 1);
  const ys = y.toISOString().split('T')[0];

  streak.count = streak.last === ys ? streak.count + 1 : 1;
  streak.last = today();

  localStorage.setItem('ffi_streak', JSON.stringify(streak));
  renderStreak();
  toast('Streak updated 🔥');
}

renderStreak();

// ===== Tasks =====
let tasks = JSON.parse(localStorage.getItem('ffi_tasks') || '[]');

function renderTasks(){
  $('taskList').innerHTML = '';

  tasks.forEach((t,i) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <span style="${t.done ? 'text-decoration:line-through' : ''}">${t.title}</span>
      <div class="row">
        <button onclick="toggleTask(${i})">${t.done ? 'Undo' : 'Done'}</button>
        <button class="danger" onclick="deleteTask(${i})">Delete</button>
      </div>`;
    $('taskList').appendChild(div);
  });

  $('taskStat').textContent = tasks.length;
}

function addTask(){
  const title = $('taskInput').value.trim();
  if(!title) return;

  tasks.push({title, done:false});
  localStorage.setItem('ffi_tasks', JSON.stringify(tasks));

  $('taskInput').value = '';
  renderTasks();
}

function toggleTask(i){
  tasks[i].done = !tasks[i].done;
  localStorage.setItem('ffi_tasks', JSON.stringify(tasks));
  renderTasks();
}

function deleteTask(i){
  tasks.splice(i,1);
  localStorage.setItem('ffi_tasks', JSON.stringify(tasks));
  renderTasks();
}

renderTasks();

// ===== Exams =====
let exams = JSON.parse(localStorage.getItem('ffi_exams') || '[]');

function renderExams(){
  $('examList').innerHTML = '';

  exams.sort((a,b) => new Date(a.date) - new Date(b.date));

  exams.forEach((e,i) => {
    const days = Math.ceil((new Date(e.date) - new Date(today())) / 86400000);

    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div>
        <strong>${e.name}</strong><br>
        <small>${e.date} • ${days} days left</small>
      </div>
      <button class="danger" onclick="removeExam(${i})">Delete</button>`;

    $('examList').appendChild(div);
  });

  $('examStat').textContent = exams.length;
}

function addExam(){
  const name = $('examName').value.trim();
  const date = $('examDate').value;

  if(!name || !date) return;

  exams.push({name,date});
  localStorage.setItem('ffi_exams', JSON.stringify(exams));

  $('examName').value = '';
  $('examDate').value = '';

  renderExams();
}

function removeExam(i){
  exams.splice(i,1);
  localStorage.setItem('ffi_exams', JSON.stringify(exams));
  renderExams();
}

renderExams();

// ===== SGPA =====
let subjects = JSON.parse(localStorage.getItem('ffi_subjects') || '[]');

function renderSubjects(){
  $('sgpaList').innerHTML = '';

  let tc = 0, tp = 0;

  subjects.forEach((s,i) => {
    tc += s.credits;
    tp += s.credits * s.grade;

    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <div>
        <strong>${s.name}</strong><br>
        <small>Credits: ${s.credits} | Grade: ${s.grade}</small>
      </div>
      <button class="danger" onclick="removeSubject(${i})">Delete</button>`;

    $('sgpaList').appendChild(div);
  });

  const sgpa = tc ? (tp/tc).toFixed(2) : '0.00';
  $('sgpaResult').textContent = 'SGPA: ' + sgpa;
}

function addSubject(){
  const name = $('subName').value.trim();
  const credits = parseFloat($('credits').value);
  const grade = parseFloat($('grade').value);

  if(!name || isNaN(credits)) return;

  subjects.push({name,credits,grade});
  localStorage.setItem('ffi_subjects', JSON.stringify(subjects));

  $('subName').value = '';
  $('credits').value = '';

  renderSubjects();
}

function removeSubject(i){
  subjects.splice(i,1);
  localStorage.setItem('ffi_subjects', JSON.stringify(subjects));
  renderSubjects();
}

renderSubjects();

// ===== Analytics Chart =====
const ctx = document.getElementById('analyticsChart');

new Chart(ctx, {
  type:'bar',
  data:{
    labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
    datasets:[{
      label:'Study Hours',
      data:[1,2,1.5,3,2.5,4,2],
      borderWidth:1
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:true
  }
});
</script>
</body>
</html>
